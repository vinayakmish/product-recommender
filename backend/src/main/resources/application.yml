# ===================================================================
# Product Recommendation System - Application Configuration
# ===================================================================

spring:
  application:
    name: product-recommender

  # --- Database Configuration ---
  # Default: H2 in-memory (for quick dev). Switch to PostgreSQL for production.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # H2 Console (dev only)
  h2:
    console:
      enabled: true
      path: /h2-console

  datasource:
    url: jdbc:h2:mem:recommenderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # Initialize sample data
  sql:
    init:
      mode: always

# --- Server Configuration ---
server:
  port: ${PORT:8080}

# --- ML Service Configuration ---
ml-service:
  base-url: ${ML_SERVICE_URL:http://localhost:8000}
  timeout-seconds: 60

# --- Swagger / OpenAPI ---
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# --- Logging ---
logging:
  level:
    com.recommender: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

---
# PostgreSQL profile
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/recommenderdb
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: false
